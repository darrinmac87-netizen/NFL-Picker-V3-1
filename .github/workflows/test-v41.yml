
name: DDD V4.1 Safe Tests

on:
  workflow_dispatch:
  push:
    branches:
      - DDD-V4.1-Adaptive

permissions:
  contents: read

jobs:
  test-v41:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out development branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check Python syntax
        run: |
          python -m compileall -q src tests

      - name: Run V4.1 tests
        run: |
          python -m unittest discover -s tests -p "test_v41_features.py" -v
