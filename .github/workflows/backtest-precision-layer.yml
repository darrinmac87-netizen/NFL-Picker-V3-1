name: Run NFL Picker Precision Backtest

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  precision-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run precision backtest
        run: |
          python run_precision_backtest.py

      - name: Commit precision backtest reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            outputs/precision_backtest_detail.csv \
            outputs/precision_backtest_summary.csv \
            outputs/precision_backtest_weekly_top.csv \
            outputs/precision_backtest_readiness.csv

          if git diff --cached --quiet; then
            echo "No precision backtest report changes to commit."
            exit 0
          fi

          git commit -m "Update NFL Picker precision backtest"

          git pull --rebase origin main
          git push origin HEAD:main
