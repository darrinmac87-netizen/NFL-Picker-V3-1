name: Train NFL Picker V3.1

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nfl-picker-v31-main
  cancel-in-progress: false

jobs:
  train-v31:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Optimize V3.1 and build 2026 production model
        run: |
          python train_v31_external.py

      - name: Commit V3.1 results and production model
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add outputs/v31_validation_trials.csv
          git add outputs/v31_2025_holdout_games.csv
          git add outputs/v31_2025_weekly_results.csv
          git add outputs/v31_learned_weights.csv
          git add outputs/v31_production_model.json
          git add outputs/v31_summary.json

          if git diff --cached --quiet; then
            echo "No V3.1 result changes to commit."
            exit 0
          fi

          git commit -m "Update NFL Picker V3.1 model"
          git pull --rebase origin main
          git push origin main
