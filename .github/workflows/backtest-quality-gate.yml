name: Run NFL Picker Quality Gate Backtest

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  quality-gate-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run quality gate backtest
        run: |
          python run_quality_gate_backtest.py

      - name: Commit quality gate reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add outputs/quality_gate_backtest_detail.csv
          git add outputs/quality_gate_backtest_quality.csv
          git add outputs/quality_gate_backtest_weekly_top_ranked.csv
          git add outputs/quality_gate_backtest_best_pick.csv
          git add outputs/quality_gate_backtest_readiness.csv

          if git diff --cached --quiet; then
            echo "No quality gate report changes."
            exit 0
          fi

          git commit -m "Update corrected quality gate backtest reports"
          git pull --rebase origin main
          git push origin main
